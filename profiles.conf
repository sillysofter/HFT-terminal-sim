# HFT-SIM configuration
#
# [market] lists the Binance spot symbols to stream (all must share the
# quote currency). Profiles each get their own starting cash (in the quote
# currency) and starting asset holdings, plus a strategy and its parameters.
#
# Profile keys (all optional; defaults shown):
#   strategy      = imbalance       momentum | meanrev | imbalance
#   cash          = 10000           starting quote-currency balance
#   hold.<ASSET>  = 0               starting holding, e.g. hold.BTC = 0.05
#   symbols       = <all>           subset of market symbols to trade
#   order_usd     = 500             notional per entry
#   tp_bps        = 8               take-profit (basis points)
#   sl_bps        = 12              stop-loss (basis points)
#   fee_bps       = 10              fee per side (Binance standard taker = 10)
#   max_hold_ms   = 60000           force-exit a position after this long
#   cooldown_ms   = 2000            min time between entries per symbol
#   fast, slow    = 8, 40           momentum: EMA periods (ticks)
#   threshold_bps = 1.0             momentum: min EMA gap to act
#   window        = 120             meanrev: rolling window (ticks)
#   z_entry       = 2.0             meanrev: z-score to enter
#   imb_entry     = 0.8             imbalance: bid share of top-of-book to go long
#
# Holding assets lets a profile sell into a down signal (and buy back later);
# holding cash lets it buy into an up signal.

[market]
symbols  = BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT
quote    = USDT
poll_ms  = 250
# US users: api_base = https://api.binance.us
api_base = https://api.binance.com

[profile Alice]
strategy  = imbalance
cash      = 10000
hold.BTC  = 0.05
hold.ETH  = 1.5
fee_bps   = 10
order_usd = 1000

[profile Bob]
strategy  = momentum
cash      = 25000
symbols   = BTCUSDT, ETHUSDT, SOLUSDT
fast      = 5
slow      = 30
threshold_bps = 0.8
fee_bps   = 2
tp_bps    = 6
sl_bps    = 8

[profile Carol]
strategy  = meanrev
cash      = 5000
hold.SOL  = 20
hold.XRP  = 2000
window    = 80
z_entry   = 2.2
fee_bps   = 0
tp_bps    = 5
sl_bps    = 10

[profile Dave]
strategy  = imbalance
cash      = 500
hold.BNB  = 3
imb_entry = 0.9
fee_bps   = 7.5
order_usd = 400
